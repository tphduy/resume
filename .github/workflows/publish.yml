name: Publish resume

on:
  push:
    branches: [main, ci-build]
    paths: [resume.md, Makefile, metadata.json, 'scripts/**', 'templates/**', styles/resume.css, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install pandoc typst poppler

      - name: Build and verify
        run: make site verify OUT=site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
